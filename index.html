<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Türkiye Haritam — Gezdiğim İller</title>
  <meta name="description" content="Türkiye'nin 81 ilini boya, gezdiğin yerleri işaretle, haritanı paylaş.">

  <!-- Open Graph / Twitter. These are DEFAULTS for direct visits; the Pages
       Function on / (functions/index.js) rewrites og:image, og:title,
       og:description and twitter:* server-side when ?v= is present, so link
       crawlers (which do not run JS) see the shared map. Order matters only in
       that these must stay inside <head>. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Türkiye Haritam">
  <meta property="og:description" content="Türkiye'nin 81 ilini boya, gezdiğin yerleri işaretle, haritanı paylaş.">
  <meta property="og:image" content="/og">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Türkiye Haritam">
  <meta name="twitter:description" content="Türkiye'nin 81 ilini boya, gezdiğin yerleri işaretle, haritanı paylaş.">
  <meta name="twitter:image" content="/og">

  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --unvisited: #e5e7eb;
      --gectim: #fdba74;
      --gezdim: #38bdf8;
      --yasadim: #15803f;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    .wrap {
      width: min(1200px, calc(100vw - 24px));
      margin: 0 auto;
      padding: 12px 0 calc(24px + env(safe-area-inset-bottom));
    }
    header { text-align: center; margin-bottom: 12px; }
    h1 { font-size: 1.15rem; margin: 0 0 4px; }
    .counter {
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1.1;
    }
    .counter small { font-weight: 500; color: var(--muted); font-size: 0.95rem; }

    .map-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 4px;
      overflow-x: auto;
    }
    .map-svg {
      display: block;
      width: 100%;
      height: auto;
      /* prevent long-press text selection / callout on mobile */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin: 14px 0 4px;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 10px;
      text-align: center;
    }
    .stat-value {
      display: block;
      font-size: 1.3rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 5px;
    }
    .stat-label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .stat.gectim .stat-value { color: var(--gectim); }
    .stat.gezdim .stat-value { color: var(--gezdim); }
    .stat.yasadim .stat-value { color: var(--yasadim); }
    .province {
      cursor: pointer;
      transition: fill 120ms ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .province:focus-visible { outline: 2px solid #0284c7; outline-offset: 1px; }

    .hint {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      margin: 8px 0 0;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 18px;
      margin: 16px 0;
    }
    .legend-item { display: flex; align-items: center; gap: 7px; font-size: 0.9rem; }
    .swatch {
      width: 16px; height: 16px; border-radius: 4px;
      border: 1px solid rgba(0,0,0,0.15);
      flex: none;
    }

    .actions { display: flex; gap: 10px; justify-content: center; }
    .share-hint {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      margin: 10px 0 0;
    }
    button {
      font: inherit;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      padding: 11px 18px;
      border-radius: 10px;
      cursor: pointer;
      min-height: 44px; /* comfortable tap target */
    }
    button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
    button:active { transform: translateY(1px); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      background: var(--ink);
      color: #fff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }
    .toast.show { opacity: 1; }
    @media (max-width: 720px) {
      .wrap {
        width: min(100vw, calc(100vw - 16px));
        padding-top: 8px;
      }
      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Türkiye Haritam</h1>
      <div class="counter"><span id="count">0</span>/81 <small>il gezildi</small></div>
    </header>

    <div class="map-card">
      <div id="map"></div>
    </div>
    <p class="hint">Dokun: sonraki seviye · Uzun bas veya sağ tık: geri</p>

    <div class="stats" aria-label="Kategori istatistikleri">
      <div class="stat gectim">
        <span class="stat-value" id="count-gectim">0</span>
        <span class="stat-label">Geçtim</span>
      </div>
      <div class="stat gezdim">
        <span class="stat-value" id="count-gezdim">0</span>
        <span class="stat-label">Gezdim</span>
      </div>
      <div class="stat yasadim">
        <span class="stat-value" id="count-yasadim">0</span>
        <span class="stat-label">Yaşadım</span>
      </div>
    </div>

    <div class="legend" id="legend"></div>

    <div class="actions">
      <button class="primary" id="share">PNG indir</button>
      <button id="reset">Sıfırla</button>
    </div>
    <p class="share-hint">İndirince PNG dosyası oluşur: <span id="share-hint-count">0</span>/81 il işaretli.</p>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { createMap, LEVELS } from "./src/map.js";

    const $ = (id) => document.getElementById(id);

    // Legend: the three visit levels with their colors and Turkish labels.
    const legend = $("legend");
    for (const lvl of LEVELS) {
      const item = document.createElement("div");
      item.className = "legend-item";
      const sw = document.createElement("span");
      sw.className = "swatch";
      sw.style.background = lvl.color;
      const txt = document.createElement("span");
      txt.textContent = lvl.label;
      item.append(sw, txt);
      legend.appendChild(item);
    }

    const countEls = {
      gectim: $("count-gectim"),
      gezdim: $("count-gezdim"),
      yasadim: $("count-yasadim"),
    };

    function renderStats(counts) {
      countEls.gectim.textContent = String(counts[1] || 0);
      countEls.gezdim.textContent = String(counts[2] || 0);
      countEls.yasadim.textContent = String(counts[3] || 0);
    }

    let toastTimer = null;
    function toast(msg) {
      const t = $("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
    }

    // Download the current map as a PNG file.
    async function downloadMapPng(code) {
      const imageUrl = new URL("/og", window.location.origin);
      imageUrl.searchParams.set("v", code);

      const res = await fetch(imageUrl);
      if (!res.ok) throw new Error("image fetch failed");

      const blob = await res.blob();
      const objectUrl = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = objectUrl;
      link.download = "turkiye-haritam.png";
      link.rel = "noopener";
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
    }
    async function main() {
      let topology;
      try {
        const res = await fetch("./data/provinces.topo.json");
        topology = await res.json();
      } catch (e) {
        $("map").textContent = "Harita yüklenemedi.";
        return;
      }

      const map = createMap({
        topology,
        mount: $("map"),
        width: 1000,
        onChange: ({ count, counts }) => {
          $("count").textContent = count;
          $("share-hint-count").textContent = count;
          renderStats(counts);
        },
      });

      $("reset").addEventListener("click", () => {
        map.reset();
        // Drop ?v= so a reset doesn't get re-loaded from the URL on refresh.
        const u = new URL(window.location.href);
        if (u.searchParams.has("v")) {
          u.searchParams.delete("v");
          history.replaceState(null, "", u.pathname + u.search);
        }
        toast("Harita sıfırlandı");
      });

      $("share").addEventListener("click", async () => {
        try {
          await downloadMapPng(map.getCode());
          toast("PNG indirildi");
        } catch (err) {
          console.error(err);
          toast("PNG indirilemedi");
        }
      });
    }

    main();
  </script>
</body>
</html>
