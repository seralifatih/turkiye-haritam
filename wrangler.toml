name = "turkiye-haritam"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages project. build.js copies the static files into dist/ and
# writes a tiny dist/_worker.js that re-exports src/worker.js, so Pages compiles
# the Worker (and its wasm imports) itself.
pages_build_output_dir = "dist"

# NOTE: Pages does NOT support [[rules]] in wrangler.toml (it errors with
# "Configuration file for Pages projects does not support rules"). It isn't
# needed: when Pages compiles an advanced-mode _worker.js, it already binds
# `.wasm` imports as precompiled WebAssembly.Module values by default, so
# `import resvgWasm from "@resvg/resvg-wasm/index_bg.wasm"` and the yoga import
# go straight to initWasm()/initYoga() with no runtime WebAssembly.compile.
